<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Learning Experiment Platform data and reasoning flow</title>
<desc id="desc">Seeded assignment connects participant IDs to pre/post records, complete-case outcome analysis, effect estimates, bootstrap intervals, and attrition flags.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Learning Experiment Platform · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Missing post outcomes remain visible as attrition; effects stay grouped by assigned condition.</text>

<rect x="60" y="145" width="230" height="110" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="175" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">01</text>
<text x="175" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Participant IDs +</text>
<text x="175" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">seeded assignment</text>

<line x1="295" y1="200" x2="350" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="365" y="145" width="230" height="110" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="480" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">02</text>
<text x="480" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Pre/post records +</text>
<text x="480" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">missing outcomes</text>

<line x1="600" y1="200" x2="655" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="670" y="145" width="230" height="110" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="785" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">03</text>
<text x="785" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Means + gains +</text>
<text x="785" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Cohen d + bootstrap CI</text>

<line x1="905" y1="200" x2="945" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="960" y="145" width="190" height="110" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1055" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">04</text>
<text x="1055" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Attrition +</text>
<text x="1055" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">analysis flags</text>

<text x="60" y="320" font-family="Arial" font-size="15" fill="#5B6660">The baseline is complete-case for post outcomes; it does not silently impute missing scores.</text>
<text x="60" y="346" font-family="Arial" font-size="15" fill="#5B6660">A confidence interval or effect size is evidence to interpret, not an automatic causal conclusion.</text>
</svg>