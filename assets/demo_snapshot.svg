<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Learning Experiment Platform synthetic demo snapshot</title>
<desc id="desc">Synthetic end-to-end experiment output showing assignment, attrition, post-test mean difference, bootstrap confidence interval, and review flags.</desc>
<rect width="1200" height="330" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic end-to-end demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">Seed 42 · 12 synthetic participants · software demonstration, not an empirical treatment effect.</text>

<rect x="52" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Assignment / observed</text>
<text x="70" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">6/6 assigned · 6/5 observed</text>

<rect x="330" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="348" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Post mean difference</text>
<text x="348" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">+5.27 points</text>

<rect x="608" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="626" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">95% bootstrap CI</text>
<text x="626" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">[1.50, 8.87]</text>

<rect x="886" y="112" width="262" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="904" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Attrition</text>
<text x="904" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">8.3% overall</text>

<text x="52" y="258" font-family="Arial" font-size="14" fill="#d1d5db">Review flags: attrition_present · differential_attrition_review</text>
<text x="52" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py · output remains grouped by assigned condition.</text>
</svg>