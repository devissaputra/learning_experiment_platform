<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Learning Experiment Platform evaluation checklist</title>
<desc id="desc">Illustrative evidence categories for validating assignment, uncertainty, attrition, and protocol fidelity.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Learning Experiment Platform · evaluation checklist</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Bars are illustrative only. A real study should report measured diagnostics, uncertainty, and protocol deviations.</text>
<rect x="52" y="126" width="1096" height="300" rx="18" fill="#F3F5F3" stroke="#CDD3CF"/>

<text x="70" y="189" font-family="Arial" font-size="17" fill="#26343B">assignment reproducibility</text>
<rect x="360" y="170" width="550" height="25" rx="8" fill="#E8EBE8"/><rect x="360" y="170" width="440" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="189" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="259" font-family="Arial" font-size="17" fill="#26343B">estimate uncertainty</text>
<rect x="360" y="240" width="550" height="25" rx="8" fill="#E8EBE8"/><rect x="360" y="240" width="385" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="259" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="329" font-family="Arial" font-size="17" fill="#26343B">attrition sensitivity</text>
<rect x="360" y="310" width="550" height="25" rx="8" fill="#E8EBE8"/><rect x="360" y="310" width="330" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="329" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="399" font-family="Arial" font-size="17" fill="#26343B">protocol fidelity</text>
<rect x="360" y="380" width="550" height="25" rx="8" fill="#E8EBE8"/><rect x="360" y="380" width="410" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="399" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="455" font-family="Arial" font-size="15" fill="#5B6660">The validation target is a reproducible analysis whose limitations remain visible, not a single experiment-quality score.</text>
</svg>