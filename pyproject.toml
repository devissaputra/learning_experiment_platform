[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-experiment-platform"
version = "0.1.0"
description = "Transparent scaffold for seeded learning experiments, pre/post effects, bootstrap uncertainty, and attrition review."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "ai-in-education",
  "aied",
  "learning-science",
  "experimental-design",
  "ab-testing",
  "effect-size",
  "instructional-design",
  "education-research",
]

[project.urls]
Repository = "https://github.com/devissaputra/learning_experiment_platform"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
